# engine.lock — the commit this book's arithmetic is COMPUTED BY.
#
# `record.lock`'s sibling, and the same contract read from the other side. The record is what the
# book *quotes*: a pinned commit, a declared footprint, and every quotation verified against a
# committed snapshot. This file pins what the book *runs*. Since 2026-09-02 there is one engine for
# the book and its demos — UniForge's `napkin` crate, registered as `lab/napkin/0001` — and both the
# numbers the pages print and the arithmetic the browser does come from it.
#
# Why the artifact is committed and not built: Our Bubble is public and UniForge is private. A book
# whose pages could only be built by someone with a key to the engine would be a book with a private
# dependency, which is exactly the shape this repository was split out to avoid. So the emitter's
# output and the WebAssembly module are vendored under `engine/`, hashed below, and every clone
# builds and runs with no access to UniForge at all.
#
# Why a pin and not a branch: the same reason as the record's. An engine that quietly advances is an
# engine that can change a number on a page without anyone deciding to. Advancing is a commit.
#
# WHAT IS CHECKED, and by what, on every `make check`:
#
#   1. **the hashes below**, always, needing nothing but this clone: every file in `engine/` is
#      present and hashes to what this file says, and `engine/` carries no file this file does not
#      name. That is `check_edition.py`'s `check_engine()`.
#   2. **the wasm is the same engine as the JSON**, always (node is present in tier 0): the module
#      is loaded and asked the census question, and its answer must be byte-identical to the
#      vendored JSON's own bytes for it. Two artifacts built from one commit, proven to agree.
#   3. **a fresh build reproduces the vendored bytes**, when `UNIFORGE_SRC` points at a UniForge
#      checkout at the commit below. When it does not, the checker prints
#      `engine integrity: unverified — engine source absent` and asserts nothing. A check that
#      cannot run says so; it never passes quietly.
#
# BUMPING THE ENGINE is a deliberate commit, and it is the only way the book's arithmetic advances:
#
#     1. edit `sha` below to the new UniForge commit
#     2. check that commit out in your UniForge clone
#     3. `tools/build_engine.sh`      (re-emits engine/, re-hashes this file; it REFUSES to vendor
#                                      anything if the canonical JSON stops being byte-identical to
#                                      tools/napkin_export.py's output)
#     4. `make check`                 (the tokens re-render; anything that moved is named)
#     5. commit the sha, `engine/` and the hashes together
#
# All five land in ONE commit, for the record's reason: a bump that updates the pin without
# re-vendoring would leave the book computing with one commit and citing another.
#
# Format: `key = value`, one per line; `#` comments; repeated keys accumulate. `record.lock`'s.

version       = 1
repo          = github.com/zacharyelston/UniForge
ref           = main
sha           = 96692121467b5d4f103aa8d7cad6db88ad85b909
crate         = napkin
crate_version = 0.1.2
register      = lab/napkin/0001-napkin-engine-register

# The toolchain. UniForge pins rustc and the wasm target in its own `core/rust-toolchain.toml`, so
# `cargo` run inside that checkout uses exactly this channel and `tools/build_engine.sh` only
# records what it saw. `wasm-bindgen` is the one tool the checkout does not pin: the module and its
# glue are written by it as a matching pair, so the build script refuses a different version rather
# than vendoring a pair that were never built together.

rustc         = rustc 1.97.1 (8bab26f4f 2026-07-14)
target        = wasm32-unknown-unknown
wasm_bindgen  = wasm-bindgen 0.2.127

# The build, exactly. Run from a UniForge checkout at the commit above; `tools/build_engine.sh` is
# the executable form of these four lines and is what anyone should actually run.

build = cd $UNIFORGE_SRC/core && cargo run --release -p napkin --bin napkin-export > engine/napkin.json
build = cd tools/engine_emit && cargo run --release > engine/rows.json   # R07 R10 R19
build = cd $UNIFORGE_SRC/core && cargo build --release -p napkin --lib --features wasm --target wasm32-unknown-unknown
build = wasm-bindgen --target web --out-dir engine/ $UNIFORGE_SRC/core/target/wasm32-unknown-unknown/release/napkin.wasm

# The vendored files, and what they hashed to when they were built.
#
# Every file, not a list of interesting ones: a lock naming only some of them is
# satisfied by deleting the rest. `check_edition.py` compares this block against the
# directory in both directions on every run.

sha256 = c29f1aa2f384698600b1038cfc1b8c5b7cc401361a51fdb86a605a2d4734a387  engine/napkin.d.ts
sha256 = 59f5733e33a2c985ee56dc239c95336f5cf2f806b52e4a63cca70d7aeb88ca44  engine/napkin.js
sha256 = a770f4c4d1b08e8858ad21ef39e5276996ad482126f92b0dc8932722470be007  engine/napkin.json
sha256 = d62b67ee349edfed60ca298b85545d2417415750368f4e1dd01f1784e2335713  engine/napkin_bg.wasm
sha256 = 7cdc57c25071a49eaf9df1553062f30f13d618419a405bb485de118616f8e2db  engine/napkin_bg.wasm.d.ts
sha256 = 472624b08b9b3a14ecb60cf0281186e8fe6c031c1e1543f94f8765dfba9f8afe  engine/rows.json
