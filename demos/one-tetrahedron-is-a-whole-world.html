<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Bubble · a demo</title>
<meta name="description" content="One chapter of Our Bubble's napkin world, run in your browser by the vendored napkin engine.">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="wrap">

<header class="masthead">
  <p class="kicker">Our Bubble · a demo · <span id="chapter-beats"></span></p>
  <h1 id="chapter-title"></h1>
  <div class="bar">
    <a id="back-to-chapter" href="../one-tetrahedron-is-a-whole-world.html">read the chapter</a>
    <span id="theme"></span>
  </div>
</header>

<blockquote class="scope">
  <p><strong>Scope.</strong> A <strong>toy</strong>: a small world built inside a computer. Nothing
  it draws or prints is a claim about nature.</p>
</blockquote>

<main id="demo"></main>

<noscript>
  <p>Scripting is off, so there is nothing to run. Every number is in the chapter's own text —
  <a href="../one-tetrahedron-is-a-whole-world.html">read it there</a>.</p>
</noscript>

<footer class="foot">
  <p>The arrows, or <kbd>j</kbd> and <kbd>k</kbd>, walk the beats. Every number is in a table too.
  Nothing is loaded from elsewhere, and nothing is recorded.</p>
</footer>

</div>
<script type="module">
  import { mount, themeSwitch } from "./core.mjs";
  themeSwitch(document.querySelector("#theme"));
  mount("one-tetrahedron-is-a-whole-world").catch((failure) => {
    document.querySelector("#demo").textContent =
      `The engine did not start: ${failure.message}`;
  });
</script>
</body>
</html>
