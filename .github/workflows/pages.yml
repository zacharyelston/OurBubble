# Build the book on `main` and publish it to GitHub Pages.
#
#   https://zacharyelston.github.io/OurBubble/
#
# The build half is the same tier-0 pass `check.yml` runs on pull requests, and both call the one
# implementation, `tools/check.sh`, so the site can only be built by a pass that also checks the
# book. Read `check.yml`'s header for the runner choice and — importantly — for what CI can and
# cannot verify while the engine record is a private repository.
#
# Pages is configured with `build_type: workflow`, so this workflow is the only thing that publishes.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned record
        id: record
        env:
          RECORD_TOKEN: ${{ secrets.RECORD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RECORD_TOKEN:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Published without verifying the record::RECORD_TOKEN is not set, so the private engine record could not be fetched. The site was built but its quotations were NOT verified in this run."
            {
              echo "### :warning: published without verifying the record"
              echo
              echo "\`RECORD_TOKEN\` is not set on this repository, so \`.record/\` could not be fetched."
              echo "\`check_edition.py\` needs the record for almost everything it asserts and refuses to run"
              echo "without it, so **it did not run at all** before this deploy."
              echo "What did run: the book built, and the generated appendix was confirmed to be in step with"
              echo "\`edition.json\` and the reading order."
              echo
              echo "Set \`RECORD_TOKEN\` (a fine-grained PAT with Contents:read on the engine repository), or"
              echo "make that repository public, and the quotation check becomes a publish gate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "have=true" >> "$GITHUB_OUTPUT"
          tools/fetch_record.sh

      - name: Tier 0 — check the edition against the record, build, check the built pages
        if: steps.record.outputs.have == 'true'
        run: tools/check.sh

      - name: Build and check what does not need the record
        if: steps.record.outputs.have != 'true'
        run: |
          set -euo pipefail
          mdbook build
          git diff --exit-code -- chapters/the-simulations.md

      - name: Upload the rendered book
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
