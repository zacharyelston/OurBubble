# Build the book on `main` and publish it to GitHub Pages.
#
#   https://zacharyelston.github.io/OurBubble/
#
# The build half is the same tier-0 pass `check.yml` runs on pull requests, and both call the one
# implementation, `tools/check.sh`, so the site can only be built by a pass that also checks the
# book. Read `check.yml`'s header for the runner choice and for which of the two record layers can
# run without a token.
#
# The published site carries `record/` — the committed snapshot of every file the book cites — so a
# reader can click from a number in the appendix through to the file it came from without any access
# to the engine. mdBook copies it into the build via the `chapters/record` symlink.
#
# It carries `engine/` the same way, through `chapters/engine`: the vendored napkin engine, pinned by
# `engine.lock` — the canonical payload the book's numbers are rendered from, and the crate compiled
# to WebAssembly for the reader's own browser. `check_edition.py --rendered` compares every published
# byte against the vendored file, because a symlink that stops being copied would break nothing the
# build notices. GitHub Pages serves `.wasm` with `Content-Type: application/wasm`, which is what
# `WebAssembly.instantiateStreaming` needs; no configuration is required here, and the wasm-bindgen
# glue falls back to `arrayBuffer()` if a host ever gets it wrong.
#
# Pages is configured with `build_type: workflow`, so this workflow is the only thing that publishes.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned engine (for the snapshot-integrity layer)
        id: record
        continue-on-error: true
        env:
          RECORD_TOKEN: ${{ secrets.RECORD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RECORD_TOKEN:-}" ]; then
            echo "::warning title=Snapshot integrity unverified::RECORD_TOKEN is not set, so the private engine could not be fetched and record/ was not diffed against it. Quotations are still gated against the committed snapshot."
            {
              echo "### :warning: snapshot integrity unverified — RECORD_TOKEN not set"
              echo
              echo "The engine repository is private and no \`RECORD_TOKEN\` secret is configured, so"
              echo "\`.record/\` could not be fetched and **\`record/\` was not diffed against the engine**"
              echo "before this deploy."
              echo
              echo "**Still gated in this run:** all 35 declared quotations, verbatim against the committed"
              echo "\`record/\` snapshot; the excluded-claims guard and its probes; the reading order, prose"
              echo "rules, internal links and every record link in the built book."
              echo
              echo "**Not checked:** whether \`record/\` is still byte-for-byte the engine at the pinned commit."
              echo "Add \`RECORD_TOKEN\` (a fine-grained PAT with Contents:read on the engine) to close that gap."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tools/fetch_record.sh

      - name: Tier 0 — integrity, quotations, build, rendered links
        run: tools/check.sh

      - name: Upload the rendered book
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
