# Tier 0, on every pull request and every push outside `main`.
#
# This runs exactly what `make check` runs locally — one implementation, `tools/check.sh`, so CI and
# the pre-push pass cannot drift apart. Pushes to `main` are handled by `pages.yml`, which runs the
# same pass and then publishes; splitting it this way keeps `main` from building the book twice.
#
# Runner: `ubuntu-latest`. This repository is public, so GitHub-hosted minutes are free — the
# no-paid-runners rule that sends the engine's CI to a self-hosted box does not bind here, and there
# is no self-hosted runner registered to this repository in any case.
#
# WHAT IS AND IS NOT GATED HERE. The book's quotations are verified against `record/`, the committed
# snapshot, so **the quotation gate always runs** — in CI, in a clean clone, on a machine that has
# never seen the engine. What needs engine access is the second layer: proving that snapshot is
# still the engine at the pinned commit, byte for byte. The engine is private, so that layer runs
# only when a `RECORD_TOKEN` secret exists (a fine-grained PAT with Contents:read on it). Without
# one the job says "snapshot integrity unverified" and carries on; it never implies it checked.

name: check

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned engine (for the snapshot-integrity layer)
        id: record
        continue-on-error: true
        env:
          RECORD_TOKEN: ${{ secrets.RECORD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RECORD_TOKEN:-}" ]; then
            echo "::warning title=Snapshot integrity unverified::RECORD_TOKEN is not set, so the private engine could not be fetched and record/ was not diffed against it. Quotations are still gated against the committed snapshot."
            {
              echo "### :warning: snapshot integrity unverified — RECORD_TOKEN not set"
              echo
              echo "The engine repository is private and no \`RECORD_TOKEN\` secret is configured, so"
              echo "\`.record/\` could not be fetched and **\`record/\` was not diffed against the engine**."
              echo
              echo "**Still gated in this run:** all 35 declared quotations, verbatim against the committed"
              echo "\`record/\` snapshot; the excluded-claims guard and its probes; the reading order, prose"
              echo "rules, internal links and every record link in the built book."
              echo
              echo "**Not checked:** whether \`record/\` is still byte-for-byte the engine at the pinned commit."
              echo "Add \`RECORD_TOKEN\` (a fine-grained PAT with Contents:read on the engine) to close that gap."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tools/fetch_record.sh

      - name: Tier 0 — integrity, quotations, build, rendered links
        run: tools/check.sh
