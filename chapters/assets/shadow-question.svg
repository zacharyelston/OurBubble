      <stop offset="0" stop-color="#17243a"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55c7be" stop-opacity=".23"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="34" fill="url(#sky)"/>
  <circle cx="150" cy="125" r="55" fill="#f4c95d"/>
  <circle cx="150" cy="125" r="82" fill="none" stroke="#f4c95d" stroke-opacity=".22" stroke-width="3"/>
  <path d="M0 430 Q300 370 600 425 T1200 420 V600 H0Z" fill="url(#ground)"/>
  <path d="M0 430 Q300 370 600 425 T1200 420" fill="none" stroke="#55c7be" stroke-width="5"/>
