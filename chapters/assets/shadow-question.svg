<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img"
     aria-labelledby="title desc" data-status="illustration-study">
  <title id="title">A shadow becomes a question</title>
  <desc id="desc">A child and a small post cast long shadows across a curved field toward a glowing question mark.</desc>
