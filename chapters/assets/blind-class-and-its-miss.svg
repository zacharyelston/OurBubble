<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img"
     aria-labelledby="title desc" data-status="illustration-study">
  <title id="title">First recover a known key, then work without one — and keep the declared miss</title>
  <desc id="desc">Two panels. On the left, measured markers sit on a dashed expected line, showing an instrument recovering an answer that was already known. On the right the dashed line is gone, the markers still form the same trend, and one marker sits deliberately outside a pre-drawn band that was declared before the measurement.</desc>
  <rect width="1200" height="600" rx="34" fill="#101a2c"/>

  <!-- panel frames -->
  <rect x="58" y="96" width="500" height="392" rx="24" fill="#20314a" opacity=".55"/>
  <rect x="642" y="96" width="500" height="392" rx="24" fill="#20314a" opacity=".55"/>

  <g fill="#f4ead8" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="308" y="70" font-size="21" opacity=".82">with an answer key</text>
    <text x="892" y="70" font-size="21" opacity=".82">without one</text>
  </g>

  <!-- LEFT: dashed expectation with measurements sitting on it -->
  <path d="M110 420 C210 380 300 300 400 214 S480 168 508 152"
        fill="none" stroke="#2b4160" stroke-width="6" stroke-dasharray="12 14"
        stroke-linecap="round"/>
  <g fill="#55c7be">
    <circle cx="150" cy="404" r="11"/>
    <circle cx="232" cy="367" r="11"/>
    <circle cx="314" cy="304" r="11"/>
    <circle cx="396" cy="218" r="11"/>
    <circle cx="470" cy="168" r="11"/>
  </g>
  <g fill="#f4ead8" font-family="system-ui, sans-serif" font-size="18" opacity=".7">
    <text x="110" y="462">the key was known — and never handed over</text>
  </g>

  <!-- RIGHT: no expectation drawn; same trend, plus one declared miss -->
  <g fill="#55c7be">
    <circle cx="734" cy="404" r="11"/>
    <circle cx="816" cy="366" r="11"/>
    <circle cx="898" cy="303" r="11"/>
    <circle cx="980" cy="220" r="11"/>
  </g>
  <!-- the pre-registered band, drawn before the run -->
  <rect x="1020" y="196" width="86" height="92" rx="14" fill="none"
        stroke="#f4c95d" stroke-width="5" stroke-dasharray="11 13"/>
  <circle cx="1063" cy="330" r="13" fill="#f28c78"/>
  <path d="M1063 312 V246" stroke="#f28c78" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="9 11"/>
  <path d="M1063 246 l-16 24 h32Z" fill="#f28c78"/>
  <g fill="#f4ead8" font-family="system-ui, sans-serif" font-size="18" opacity=".7">
    <text x="672" y="462">one quantity was expected to land short — and did</text>
  </g>

  <!-- the band's own label -->
  <text x="1063" y="180" fill="#f4c95d" font-family="system-ui, sans-serif" font-size="17"
        text-anchor="middle" opacity=".9">stated in advance</text>

  <text x="64" y="548" fill="#f4ead8" opacity=".72" font-family="system-ui, sans-serif"
        font-size="18" letter-spacing="4">ILLUSTRATION STUDY · A BLIND MEASUREMENT KEEPS ITS OWN MISS</text>
</svg>
