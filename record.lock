# record.lock — the commit this book quotes from.
#
# Our Bubble is narrative; the evidence it rests on lives in another repository, the UniForge
# engine, and stays there. This file is the contract between them: one repository, one commit, and
# the exact list of files the edition cites or quotes. `tools/fetch_record.sh` checks that commit
# out into the ignored `.record/`, and `check_edition.py` verifies every declared quotation against
# `.record/<path>` — never against anything in this repository.
#
# Why a pin and not a branch: a quotation that is verbatim today and paraphrased tomorrow should
# break the build on the day someone decides to move, not silently on the day the engine changes.
#
# BUMPING THE RECORD is a deliberate commit, and it is the only way the book's evidence advances:
#
#     1. edit `sha` below to the new UniForge commit
#     2. `tools/fetch_record.sh`            (re-checks out `.record/` at the new commit)
#     3. `python3 check_edition.py`         (every quotation re-verified against the new commit)
#     4. fix whatever moved — or, if nothing moved, commit the one-line SHA change on its own
#
# Step 3 is the point. A bump that changes a number the book quotes fails here, by name, with the
# file it stopped being carried by. `path =` lines are derived from `edition.json` and checked
# against it on every run, so the footprint below cannot quietly under-declare what is pinned.
#
# Format: `key = value`, one per line; `#` comments; repeated keys accumulate.

version = 1
repo    = github.com/zacharyelston/UniForge
ref     = main
sha     = db59a2fc3c398095b3e3ec0e1c702272747ca637

# The record files this edition cites or quotes from. Derived from edition.json — do not hand-edit;
# regenerate with:  python3 -c 'import check_edition as c; [print("path = "+p) for p in c.declared_record_paths(c.load_manifest())]'

